<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAR | Activos Digitales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #0A2540;
    color: #FFFFFF;
    -webkit-font-smoothing: antialiased;
  }
  /* Scroll-fade animations */
  .fade-up {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.6s cubic-bezier(0.16,1,0.3,1), transform 0.6s cubic-bezier(0.16,1,0.3,1);
  }
  .fade-up.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Modal overlay */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(10,37,64,0.7);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: fadeIn 200ms ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-box {
    background: #0D3060;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 40px 48px;
    max-width: 480px; width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    animation: slideUp 300ms cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.4); padding: 4px;
    transition: color 200ms;
  }
  .modal-close:hover { color: #fff; }

  /* Responsive */
  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr !important; }
    .hero-viz { display: none !important; }
    .services-grid { grid-template-columns: 1fr !important; }
    .model-grid { grid-template-columns: 1fr !important; }
    .about-grid { grid-template-columns: 1fr !important; }
    .footer-top { grid-template-columns: 1fr !important; }
    .nav-links-desktop { display: none !important; }
    .pain-grid { grid-template-columns: 1fr !important; }
    nav { padding: 0 24px !important; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="SocialProof.jsx"></script>
<script type="text/babel" src="PainPoint.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel" src="Model.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── CTA Modal ─────────────────────────────────────────────
const CTAModal = ({ onClose }) => (
  <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
    <div className="modal-box">
      <button className="modal-close" onClick={onClose}>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div style={{ fontSize: '11px', fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#00D4FF', marginBottom: '16px' }}>
        Agendar charla técnica
      </div>
      <h3 style={{ fontSize: '24px', fontWeight: 700, color: '#fff', marginBottom: '12px', letterSpacing: '-0.02em', lineHeight: 1.2 }}>
        Hablemos de su caso
      </h3>
      <p style={{ fontSize: '15px', color: '#8EA8C4', lineHeight: 1.65, marginBottom: '28px' }}>
        Una charla de 30 minutos para entender su situación y evaluar si DAR es la solución correcta para su empresa.
      </p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
        <input type="text" placeholder="Su nombre y empresa"
          style={{ padding: '12px 16px', borderRadius: '8px', border: '1px solid rgba(255,255,255,0.15)', background: 'rgba(255,255,255,0.06)', color: '#fff', fontSize: '14px', fontFamily: "'Plus Jakarta Sans', sans-serif", outline: 'none' }}
        />
        <input type="email" placeholder="Correo electrónico"
          style={{ padding: '12px 16px', borderRadius: '8px', border: '1px solid rgba(255,255,255,0.15)', background: 'rgba(255,255,255,0.06)', color: '#fff', fontSize: '14px', fontFamily: "'Plus Jakarta Sans', sans-serif", outline: 'none' }}
        />
        <button
          style={{ padding: '14px', background: '#00D4FF', color: '#0A2540', borderRadius: '8px', fontSize: '15px', fontWeight: 600, border: 'none', cursor: 'pointer', fontFamily: "'Plus Jakarta Sans', sans-serif", letterSpacing: '0.03em' }}
          onMouseEnter={e => e.currentTarget.style.background = '#7AEAFF'}
          onMouseLeave={e => e.currentTarget.style.background = '#00D4FF'}
        >
          Enviar solicitud
        </button>
      </div>
      <p style={{ fontSize: '11px', color: 'rgba(255,255,255,0.3)', marginTop: '16px' }}>
        Respuesta en menos de 24 horas hábiles.
      </p>
    </div>
  </div>
);

// ── Scroll-fade hook ───────────────────────────────────────
const useFadeUp = () => {
  useEffect(() => {
    const els = document.querySelectorAll('.fade-up');
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); } });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
};

// ── Apply responsive class helpers ────────────────────────
const applyResponsive = () => {
  useEffect(() => {
    // Patch grid containers with responsive classes
    const heroGrid = document.querySelector('[data-grid="hero"]');
    if (heroGrid) heroGrid.classList.add('hero-grid');
    const heroViz = document.querySelector('[data-viz="hero"]');
    if (heroViz) heroViz.classList.add('hero-viz');
  }, []);
};

// ── Main App ──────────────────────────────────────────────
const App = () => {
  const [modalOpen, setModalOpen] = useState(false);

  useFadeUp();

  return (
    <>
      {/* Navigation */}
      <DARNav onCTA={() => setModalOpen(true)} />

      {/* Hero */}
      <DARHero
        onPrimary={() => setModalOpen(true)}
        onSecondary={() => document.getElementById('modelo-propiedad')?.scrollIntoView({ behavior: 'smooth' })}
      />

      {/* Social Proof */}
      <div className="fade-up">
        <DARSocialProof />
      </div>

      {/* Pain Point */}
      <div className="fade-up">
        <DARPainPoint />
      </div>

      {/* Services */}
      <div className="fade-up">
        <DARServices />
      </div>

      {/* Model */}
      <div className="fade-up">
        <DARModel onCTA={() => setModalOpen(true)} />
      </div>

      {/* About */}
      <div className="fade-up">
        <DARAbout />
      </div>

      {/* Footer */}
      <DARFooter onCTA={() => setModalOpen(true)} />

      {/* CTA Modal */}
      {modalOpen && <CTAModal onClose={() => setModalOpen(false)} />}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
