<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1E" />
      <stop offset="100%" stop-color="#0F1532" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#bg)" />
  <rect width="600" height="360" fill="url(#grid)" />
  
  <circle cx="560" cy="40" r="240" fill="#F97316" opacity="0.18" filter="blur(36px)" />

  <g filter="url(#glow)">
    <path d="M 410 0 L 410 60 A 60 60 0 0 0 470 120 L 600 120" fill="none" stroke="#F97316" stroke-width="4" opacity="0.95" />
    <path d="M 460 0 L 460 35 A 35 35 0 0 0 495 70 L 600 70" fill="none" stroke="#FDBA74" stroke-width="3" opacity="0.85" />
    <path d="M 360 0 L 360 85 A 85 85 0 0 0 445 170 L 600 170" fill="none" stroke="#F97316" stroke-width="2" opacity="0.5" stroke-dasharray="10 6" />
    <path d="M 310 0 L 310 110 A 110 110 0 0 0 420 220 L 600 220" fill="none" stroke="#FDBA74" stroke-width="1.5" opacity="0.3" />
  </g>

  <circle cx="410" cy="60" r="5" fill="#fff" filter="url(#glow)" />
  <circle cx="470" cy="120" r="5" fill="#fff" filter="url(#glow)" />
  <circle cx="495" cy="70" r="4" fill="#fff" />

  <rect x="36" y="296" width="160" height="28" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
  <text x="48" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FDBA74" letter-spacing="1.2">AUDITORÍA & COSTOS</text>
</svg>