<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04122C" />
      <stop offset="50%" stop-color="#092857" />
      <stop offset="100%" stop-color="#05447C" />
    </linearGradient>
    <linearGradient id="sphereGrad1" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>
    <linearGradient id="sphereGrad2" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cyanCapsule" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <filter id="blurLayer">
      <feGaussianBlur stdDeviation="28" />
    </filter>
    <filter id="subtleBlur">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>
  <rect width="1200" height="480" fill="url(#fbg)" />
  
  <!-- Depth spheres & meshes on right half -->
  <circle cx="1080" cy="180" r="160" fill="url(#sphereGrad2)" opacity="0.7" filter="url(#subtleBlur)" />
  <circle cx="860" cy="280" r="120" fill="url(#sphereGrad1)" />
  <ellipse cx="980" cy="380" rx="200" ry="80" fill="#00D4FF" opacity="0.25" filter="url(#blurLayer)" />
  <circle cx="780" cy="120" r="60" fill="url(#sphereGrad2)" opacity="0.5" filter="url(#subtleBlur)" />

  <!-- 3D capsule & floating rings -->
  <g transform="translate(940, 160) rotate(-28)">
    <rect x="-80" y="-30" width="160" height="60" rx="30" fill="url(#cyanCapsule)" opacity="0.9" />
    <rect x="-80" y="-30" width="160" height="60" rx="30" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <circle cx="-50" cy="0" r="16" fill="#fff" opacity="0.4" />
  </g>
  <ellipse cx="880" cy="240" rx="140" ry="40" fill="none" stroke="#67E8F9" stroke-width="2" opacity="0.4" transform="rotate(-15 880 240)" />
</svg>