<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"></path>
    </pattern>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.15"></stop>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.10"></stop>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"></rect>

  
  <ellipse cx="400" cy="250" rx="200" ry="160" fill="url(#glow1)"></ellipse>
  <ellipse cx="200" cy="150" rx="120" ry="100" fill="url(#glow2)"></ellipse>

  
  <line x1="400" y1="250" x2="200" y2="120" stroke="rgba(0,212,255,0.25)" stroke-width="1.5"></line>
  <line x1="400" y1="250" x2="600" y2="140" stroke="rgba(0,212,255,0.25)" stroke-width="1.5"></line>
  <line x1="400" y1="250" x2="160" y2="320" stroke="rgba(0,212,255,0.15)" stroke-width="1"></line>
  <line x1="400" y1="250" x2="640" y2="360" stroke="rgba(0,212,255,0.15)" stroke-width="1"></line>
  <line x1="400" y1="250" x2="300" y2="400" stroke="rgba(0,212,255,0.15)" stroke-width="1"></line>
  <line x1="400" y1="250" x2="500" y2="420" stroke="rgba(0,212,255,0.10)" stroke-width="1"></line>
  <line x1="200" y1="120" x2="100" y2="200" stroke="rgba(0,212,255,0.12)" stroke-width="1"></line>
  <line x1="600" y1="140" x2="700" y2="220" stroke="rgba(0,212,255,0.12)" stroke-width="1"></line>
  <line x1="200" y1="120" x2="600" y2="140" stroke="rgba(0,212,255,0.08)" stroke-width="1"></line>
  <line x1="160" y1="320" x2="300" y2="400" stroke="rgba(0,212,255,0.08)" stroke-width="1"></line>
  <line x1="640" y1="360" x2="500" y2="420" stroke="rgba(0,212,255,0.08)" stroke-width="1"></line>
  <line x1="700" y1="220" x2="640" y2="360" stroke="rgba(0,212,255,0.08)" stroke-width="1"></line>
  <line x1="100" y1="200" x2="160" y2="320" stroke="rgba(0,212,255,0.08)" stroke-width="1"></line>

  
  <circle cx="100" cy="200" r="4" fill="rgba(0,212,255,0.3)" stroke="rgba(0,212,255,0.5)" stroke-width="1"></circle>
  <circle cx="700" cy="220" r="4" fill="rgba(0,212,255,0.3)" stroke="rgba(0,212,255,0.5)" stroke-width="1"></circle>
  <circle cx="300" cy="400" r="5" fill="rgba(0,212,255,0.25)" stroke="rgba(0,212,255,0.4)" stroke-width="1"></circle>
  <circle cx="500" cy="420" r="5" fill="rgba(0,212,255,0.25)" stroke="rgba(0,212,255,0.4)" stroke-width="1"></circle>

  
  <circle cx="160" cy="320" r="7" fill="rgba(0,212,255,0.20)" stroke="rgba(0,212,255,0.45)" stroke-width="1.5"></circle>
  <circle cx="640" cy="360" r="7" fill="rgba(0,212,255,0.20)" stroke="rgba(0,212,255,0.45)" stroke-width="1.5"></circle>

  
  <circle cx="200" cy="120" r="10" fill="rgba(13,48,96,0.8)" stroke="#00D4FF" stroke-width="1.5" filter="url(#blur-glow)"></circle>
  <circle cx="600" cy="140" r="10" fill="rgba(13,48,96,0.8)" stroke="#00D4FF" stroke-width="1.5" filter="url(#blur-glow)"></circle>

  
  <circle cx="400" cy="250" r="18" fill="rgba(13,48,96,0.9)" stroke="#00D4FF" stroke-width="2" filter="url(#blur-glow)"></circle>
  <circle cx="400" cy="250" r="8" fill="#00D4FF" opacity="0.8"></circle>

  
  <circle cx="300" cy="185" r="2.5" fill="#00D4FF" opacity="0.6"></circle>
  <circle cx="500" cy="195" r="2.5" fill="#00D4FF" opacity="0.6"></circle>
  <circle cx="280" cy="328" r="2" fill="#00D4FF" opacity="0.4"></circle>
  <circle cx="520" cy="310" r="2" fill="#00D4FF" opacity="0.4"></circle>
</svg>