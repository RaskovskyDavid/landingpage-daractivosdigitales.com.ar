<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); padding: 24px; }
  h3 { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #6B8AAE; margin: 18px 0 10px; }
  h3:first-child { margin-top: 0; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 28px; border-radius: 8px; font-family: var(--font-sans);
    font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
    cursor: pointer; border: none; text-decoration: none;
    transition: all 200ms cubic-bezier(0.16,1,0.3,1);
  }
  .btn-primary {
    background: #00D4FF; color: #0A2540;
    box-shadow: 0 0 24px rgba(0,212,255,0.25);
  }
  .btn-primary:hover { background: #7AEAFF; transform: translateY(-1px); }

  .btn-ghost {
    background: transparent; color: #fff;
    border: 1.5px solid rgba(255,255,255,0.25);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.5); }

  .btn-outline {
    background: transparent; color: #0A2540;
    border: 1.5px solid #0A2540;
  }
  .btn-outline:hover { background: rgba(10,37,64,0.05); }

  .btn-sm { padding: 8px 18px; font-size: 12px; }
  .btn-lg { padding: 16px 36px; font-size: 16px; }
  .btn-disabled { opacity: 0.4; cursor: not-allowed; }

  .dark-bg { background: #0A2540; padding: 18px; border-radius: 10px; }
</style>
</head>
<body>
  <h3>Primary (on dark)</h3>
  <div class="dark-bg">
    <div class="row">
      <button class="btn btn-primary btn-sm">Agendar charla técnica</button>
      <button class="btn btn-primary">Agendar charla técnica</button>
      <button class="btn btn-primary btn-lg">Evaluar mi caso</button>
      <button class="btn btn-primary btn-disabled" disabled>Deshabilitado</button>
    </div>
  </div>

  <h3>Ghost / Secondary (on dark)</h3>
  <div class="dark-bg">
    <div class="row">
      <button class="btn btn-ghost btn-sm">Ver nuestro modelo</button>
      <button class="btn btn-ghost">Ver nuestro modelo</button>
      <button class="btn btn-ghost btn-lg">Ver nuestro modelo</button>
    </div>
  </div>

  <h3>Outline (on light)</h3>
  <div style="background:#F5F8FA; padding:18px; border-radius:10px;">
    <div class="row">
      <button class="btn btn-outline btn-sm">Ver servicios</button>
      <button class="btn btn-outline">Ver servicios</button>
      <button class="btn btn-outline btn-lg">Agendar consulta</button>
    </div>
  </div>
</body>
</html>
