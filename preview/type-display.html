<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0A2540; font-family: var(--font-sans); padding: 28px 32px; }
  .label-overline { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #00D4FF; margin-bottom: 16px; display: block; }
  .display { font-family: var(--font-sans); font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; color: #FFFFFF; }
  .display em { color: #00D4FF; font-style: normal; }
  .meta { font-size: 11px; color: #6B8AAE; margin-top: 10px; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
  <span class="label-overline">Display / Hero — Plus Jakarta Sans 700</span>
  <div class="display">Transforme su información<br>en su activo más <em>rentable.</em></div>
  <div class="meta">64px · weight 700 · tracking -0.02em · lh 1.1</div>
</body>
</html>
