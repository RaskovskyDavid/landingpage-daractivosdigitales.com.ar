<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F5F8FA; font-family: var(--font-sans); padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .token { background: #fff; border-radius: 8px; border: 1px solid rgba(10,37,64,0.08); padding: 10px 8px; text-align: center; }
  .bar { background: #0A2540; border-radius: 2px; margin: 0 auto 8px; width: 100%; }
  .val { font-size: 13px; font-weight: 700; color: #0A2540; }
  .name { font-size: 9px; color: #8EA8C4; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  h3 { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #6B8AAE; margin: 0 0 10px; }
</style>
</head>
<body>
  <h3>Spacing Scale — 8px Base Unit</h3>
  <div class="grid">
    <div class="token"><div class="bar" style="height:4px"></div><div class="val">4</div><div class="name">--space-1</div></div>
    <div class="token"><div class="bar" style="height:8px"></div><div class="val">8</div><div class="name">--space-2</div></div>
    <div class="token"><div class="bar" style="height:12px"></div><div class="val">12</div><div class="name">--space-3</div></div>
    <div class="token"><div class="bar" style="height:16px"></div><div class="val">16</div><div class="name">--space-4</div></div>
    <div class="token"><div class="bar" style="height:24px"></div><div class="val">24</div><div class="name">--space-6</div></div>
    <div class="token"><div class="bar" style="height:32px"></div><div class="val">32</div><div class="name">--space-8</div></div>
    <div class="token"><div class="bar" style="height:48px"></div><div class="val">48</div><div class="name">--space-12</div></div>
  </div>
</body>
</html>
